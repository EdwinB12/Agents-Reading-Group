<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 680" font-family="Open Sans, Helvetica, Arial, sans-serif">
  <title>Illustrative dependency cascade in the 6 Oct bulk release: one sign error, three withdrawals, fourteen revisions</title>
  <defs>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/>
    </marker>
  </defs>
  <rect width="480" height="680" fill="#F8F8F9"/>

  <!-- the error -->
  <rect x="120" y="40" width="240" height="84" rx="10" fill="#FBE9E7" stroke="#B3261E" stroke-width="3"/>
  <text x="240" y="74" text-anchor="middle" font-size="20" font-weight="700" fill="#B3261E">Manuscript 1</text>
  <text x="240" y="100" text-anchor="middle" font-size="16" fill="#131E29">a sign error</text>

  <!-- dependants -->
  <g stroke="#B3261E" stroke-width="3" fill="none" marker-end="url(#arrow-red)">
    <path d="M200,124 L130,190"/>
    <path d="M280,124 L350,190"/>
  </g>
  <text x="240" y="170" text-anchor="middle" font-size="14" fill="#131E29">built on it</text>
  <g fill="#FBE9E7" stroke="#B3261E" stroke-width="3" stroke-dasharray="6 4">
    <rect x="30" y="192" width="190" height="78" rx="10"/>
    <rect x="260" y="192" width="190" height="78" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#B3261E">
    <text x="125" y="226" font-size="19" font-weight="700">Manuscript 2</text>
    <text x="355" y="226" font-size="19" font-weight="700">Manuscript 3</text>
  </g>
  <g text-anchor="middle" font-size="15" fill="#131E29">
    <text x="125" y="252">construction fails</text>
    <text x="355" y="252">construction fails</text>
  </g>
  <rect x="30" y="292" width="420" height="40" rx="8" fill="#B3261E"/>
  <text x="240" y="318" text-anchor="middle" font-size="18" font-weight="700" fill="#F8F8F9">3 withdrawn within 24 hours</text>

  <!-- revised -->
  <g fill="#B26A00">
    <circle cx="66" cy="380" r="11"/><circle cx="96" cy="380" r="11"/><circle cx="126" cy="380" r="11"/>
    <circle cx="156" cy="380" r="11"/><circle cx="186" cy="380" r="11"/><circle cx="216" cy="380" r="11"/>
    <circle cx="246" cy="380" r="11"/><circle cx="66" cy="410" r="11"/><circle cx="96" cy="410" r="11"/>
    <circle cx="126" cy="410" r="11"/><circle cx="156" cy="410" r="11"/><circle cx="186" cy="410" r="11"/>
    <circle cx="216" cy="410" r="11"/><circle cx="246" cy="410" r="11"/>
  </g>
  <text x="280" y="388" font-size="18" font-weight="700" fill="#B26A00">14 revised</text>
  <text x="280" y="412" font-size="15" fill="#131E29">repaired proofs,</text>
  <text x="280" y="430" font-size="15" fill="#131E29">corrected statements</text>

  <!-- the rest -->
  <g fill="#440099" opacity="0.35">
    <circle cx="66" cy="472" r="7"/><circle cx="86" cy="472" r="7"/><circle cx="106" cy="472" r="7"/><circle cx="126" cy="472" r="7"/><circle cx="146" cy="472" r="7"/><circle cx="166" cy="472" r="7"/><circle cx="186" cy="472" r="7"/><circle cx="206" cy="472" r="7"/><circle cx="226" cy="472" r="7"/><circle cx="246" cy="472" r="7"/>
    <circle cx="66" cy="492" r="7"/><circle cx="86" cy="492" r="7"/><circle cx="106" cy="492" r="7"/><circle cx="126" cy="492" r="7"/><circle cx="146" cy="492" r="7"/><circle cx="166" cy="492" r="7"/><circle cx="186" cy="492" r="7"/><circle cx="206" cy="492" r="7"/><circle cx="226" cy="492" r="7"/><circle cx="246" cy="492" r="7"/>
    <circle cx="66" cy="512" r="7"/><circle cx="86" cy="512" r="7"/><circle cx="106" cy="512" r="7"/><circle cx="126" cy="512" r="7"/><circle cx="146" cy="512" r="7"/><circle cx="166" cy="512" r="7"/><circle cx="186" cy="512" r="7"/><circle cx="206" cy="512" r="7"/><circle cx="226" cy="512" r="7"/><circle cx="246" cy="512" r="7"/>
  </g>
  <text x="280" y="488" font-size="18" font-weight="700" fill="#440099">705 unchanged</text>
  <text x="280" y="512" font-size="15" fill="#131E29">no errors reported</text>
  <text x="280" y="530" font-size="15" fill="#131E29">in the first 24 hours</text>

  <text x="240" y="600" text-anchor="middle" font-size="15" font-style="italic" fill="#131E29">Illustrative, not the real dependency graph.</text>
  <text x="240" y="622" text-anchor="middle" font-size="15" font-style="italic" fill="#131E29">Counts from the 6 Oct release (722 manuscripts).</text>
</svg>
